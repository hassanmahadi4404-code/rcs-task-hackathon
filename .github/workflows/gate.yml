# The Gate, on demand: Actions > Gate > Run workflow. Judges run the same
# `npm run gate` locally, so this is only for a green badge if you want one.
name: Gate
on: workflow_dispatch

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: npm run gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only
